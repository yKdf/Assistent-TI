name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: cargo test --workspace --locked
      - run: cargo build --release --workspace --locked
      - uses: actions/upload-artifact@v4
        with:
          name: assistente-ti-${{ runner.os }}
          path: |
            target/release/assist-server
            target/release/assist-manager
            target/release/assist-release
            target/release/assist-agent.exe
            target/release/assist-manager.exe
            target/release/assist-release.exe
