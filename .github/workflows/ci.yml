name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Check server installer configuration
        if: runner.os == 'Linux'
        run: bash scripts/linux/test-server-config.sh
      - run: cargo test --workspace --locked
      - run: cargo build --release --workspace --locked
      - name: Prepare installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap-inno.ps1
      - name: Build Windows installer and packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows-installer.ps1 -SkipBuild
          ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: assistente-ti-${{ runner.os }}
          path: |
            dist/AssistenteTI-Setup-*.exe
            dist/AssistenteTI-*.zip
            dist/SHA256SUMS.txt
            target/release/assist-server
            target/release/assist-manager
            target/release/assist-release
            target/release/assist-agent.exe
            target/release/assist-manager.exe
            target/release/assist-release.exe
            target/release/assist-server.exe
